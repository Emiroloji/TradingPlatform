# Dokploy (Compose) için: Git deposundan bu dosyayla kurulur.
# Gizli değerler Dokploy → Environment sekmesinden verilir (.env depoya girmez).
# Panel: Dokploy → Domains → servis "borsa-dashboard", port 8501.
#
# Sunucu başka projelerle paylaşılıyor (4 GB RAM):
# - Servis adları "borsa-" ön eklidir: Dokploy ağında "db" gibi ortak bir ad başka projenin
#   konteynerine çözümlenebilir.
# - Her serviste bellek sınırı var; aşan servis kendi swap'ine düşer, komşuları boğmaz.
#   Ölçülen tepe kullanım (Linux, S&P 500 + BIST): günlük akış ~0,9 GB, aylık eğitim ~1,5 GB.
services:
  borsa-db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: borsa
      POSTGRES_USER: borsa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      # timescaledb-tune ilk kurulumda ayarları sunucunun tüm RAM'ine göre yapar; sınıra göre yapsın
      TS_TUNE_MEMORY: 512MB
      TS_TUNE_NUM_CPUS: "1"
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U borsa -d borsa"]
      interval: 10s
      retries: 10

  borsa-scheduler:
    build: .
    restart: unless-stopped
    # ilk açılışta veri/model yoksa üretir, sonra hafta içi günlük akış + aylık yeniden eğitim
    command: ["sh", "-c", "python main.py bootstrap && python main.py schedule"]
    environment: &app_env
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY gerekli}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SEC_USER_AGENT: ${SEC_USER_AGENT:?SEC_USER_AGENT gerekli (Ad eposta)}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
      DATABASE_URL: postgresql://borsa:${POSTGRES_PASSWORD}@borsa-db:5432/borsa
      TZ: Europe/Istanbul
    volumes:
      - storage:/app/storage
      - registry:/app/model/registry
    # her iş ayrı alt süreçte çalışır; boşta ~250 MB, aylık eğitimde ~1,5 GB
    mem_limit: 1600m
    depends_on:
      borsa-db:
        condition: service_healthy

  borsa-dashboard:
    build: .
    restart: unless-stopped
    command: ["streamlit", "run", "report/dashboard.py", "--server.headless", "true",
              "--server.address", "0.0.0.0", "--server.port", "8501"]
    environment:
      <<: *app_env
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?DASHBOARD_PASSWORD gerekli (panel şifresi)}
    expose:
      - "8501"
    volumes:
      - storage:/app/storage:ro
      - registry:/app/model/registry:ro
    mem_limit: 512m
    depends_on:
      - borsa-scheduler

volumes:
  pgdata:
  storage:
  registry:
